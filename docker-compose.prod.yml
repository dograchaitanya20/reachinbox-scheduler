services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: "${PG_PASSWORD}", POSTGRES_DB: scheduler }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app -d scheduler"], interval: 5s, retries: 10 }
    restart: unless-stopped
  redis:
    image: redis:7
    command: ["redis-server","--appendonly","yes","--maxmemory-policy","noeviction"]
    volumes: [redisdata:/data]
    restart: unless-stopped
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment: { discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms512m -Xmx512m" }
    volumes: [esdata:/usr/share/elasticsearch/data]
    restart: unless-stopped
  migrate:
    build: ./backend
    command: ["npx","prisma","migrate","deploy"]
    env_file: ./backend/.env.prod
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build: ./backend
    command: ["npx","tsx","src/server.ts"]
    env_file: ./backend/.env.prod
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started }, es: { condition: service_started } }
    restart: unless-stopped
  worker:
    build: ./backend
    command: ["npx","tsx","src/worker.ts"]
    env_file: ./backend/.env.prod
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started } }
    restart: unless-stopped
  frontend:
    build: { context: ./frontend, args: { BACKEND_URL: "http://api:4000" } }
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [api, frontend]
    restart: unless-stopped
volumes: { pgdata: {}, redisdata: {}, esdata: {}, caddy_data: {}, caddy_config: {} }